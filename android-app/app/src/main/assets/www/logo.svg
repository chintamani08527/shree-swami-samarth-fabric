<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="50%" stop-color="#1b3a5d" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle with Navy to Teal gradient -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Inner border ring -->
  <rect x="28" y="28" width="456" height="456" rx="106" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="4" />

  <!-- Textile Weave Pattern (Warp & Weft Loom) -->
  <g stroke="url(#lineGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Horizontal Weft Lines -->
    <line x1="112" y1="160" x2="400" y2="160" />
    <line x1="112" y1="256" x2="400" y2="256" />
    <line x1="112" y1="352" x2="400" y2="352" />
    <!-- Vertical Warp Lines -->
    <line x1="160" y1="112" x2="160" y2="400" />
    <line x1="256" y1="112" x2="256" y2="400" />
    <line x1="352" y1="112" x2="352" y2="400" />
  </g>
</svg>